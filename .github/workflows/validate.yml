name: Validate Agent Workshop Hub
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Validate PowerShell scripts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($file in @("install.ps1", "start.ps1", "scripts/ollama.ps1", "scripts/comfyui-status.ps1", "scripts/install-comfyui.ps1", "scripts/setup-comfyui-env.ps1", "scripts/comfyui-gpu.ps1", "scripts/start-comfyui.ps1", "scripts/install-comfyui-torch.ps1")) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | Out-String | Write-Error; exit 1 }
          }
      - name: Installer dry run (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./install.ps1 -DryRun
          ./install.ps1 -DryRun -InstallOllama
          ./install.ps1 -DryRun -InstallComfyUISource -SetupComfyUIEnv -InstallComfyUIRequirements
          ./install.ps1 -DryRun -InstallWSL -RunUbuntuBootstrap -InstallOpenCode -InstallNode -UseNvmFallback -Distro Ubuntu-24.04
      - name: Ollama utility dry run (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/ollama.ps1 -DryRun
          ./scripts/ollama.ps1 -DryRun -Pull -Model qwen2.5-coder:7b
      - name: ComfyUI utilities dry run (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/install-comfyui.ps1 -DryRun
          ./scripts/setup-comfyui-env.ps1 -DryRun -InstallRequirements
          ./scripts/comfyui-status.ps1 -DryRun
          ./scripts/comfyui-gpu.ps1 -DryRun
          ./scripts/start-comfyui.ps1 -DryRun
          ./scripts/install-comfyui-torch.ps1 -DryRun -CudaWheel cu128
          ./scripts/install-comfyui-torch.ps1 -DryRun -CudaWheel cu126
      - name: Launcher dry run (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./start.ps1 -DryRun -Port 8787
      - name: Compile modules
        run: python -m compileall -q workshop tests
      - name: Unit and local HTTP integration tests
        run: python -m unittest discover -s tests -v
      - name: Runtime preflight
        run: python -m workshop.preflight
  linux-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell syntax
        run: bash -n scripts/bootstrap.sh scripts/start.sh scripts/install-opencode.sh scripts/install-node.sh
      - name: Bootstrap dry run
        run: bash scripts/bootstrap.sh --dry-run
      - name: Node installer dry run
        run: |
          bash scripts/install-node.sh --dry-run
          bash scripts/install-node.sh --dry-run --use-nvm
      - name: OpenCode installer dry run
        run: bash scripts/install-opencode.sh --dry-run
      - name: Validate YAML example
        run: |
          python -m pip install PyYAML
          python -c "import yaml; yaml.safe_load(open('config/workshop.example.yaml', encoding='utf-8'))"
