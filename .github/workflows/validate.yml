name: Validate JetAI Hub
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Validate PowerShell scripts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($file in @("install.ps1", "start.ps1", "scripts/ollama.ps1", "scripts/create-shortcut.ps1")) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | Out-String | Write-Error; exit 1 }
          }
      - name: Installer dry run (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./install.ps1 -DryRun
          ./install.ps1 -DryRun -InstallOllama
          ./install.ps1 -DryRun -InstallWSL -RunUbuntuBootstrap -InstallOpenCode -InstallNode -UseNvmFallback -Distro Ubuntu-24.04
      - name: Ollama utility dry run (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/ollama.ps1 -DryRun
          ./scripts/ollama.ps1 -DryRun -Pull -Model qwen2.5-coder:7b
      - name: Launcher dry run (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./start.ps1 -DryRun -Port 8787
          ./start.ps1 -DryRun -Port 8787 -Terminal
          ./jetai.ps1 -DryRun
          ./scripts/create-shortcut.ps1 -DryRun -Native
          ./scripts/create-shortcut.ps1 -DryRun
          ./scripts/create-shortcut.ps1 -DryRun -NoTerminal -Name "JetAI Hub Test"
      - name: Native launcher smoke test (Windows, no WSL)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process pwsh -ArgumentList "-NoProfile","-File","./jetai.ps1","-NoBrowser","-Port","8799" -PassThru -WindowStyle Hidden
          try {
            $body = $null
            for ($i = 0; $i -lt 40 -and -not $body; $i++) {
              try { $body = (Invoke-WebRequest -Uri "http://127.0.0.1:8799/app" -UseBasicParsing -TimeoutSec 2).Content } catch { Start-Sleep -Milliseconds 500 }
            }
            if (-not $body) { throw "jetai.ps1 did not serve /app" }
            if ($body -notmatch "JetAI Hub") { throw "/app did not render the app shell" }
            Write-Host "native launcher served /app on Windows without WSL"
          } finally {
            Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -match "workshop.dashboard" } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Portable package build and run (Windows, Python 3.12 job only)
        if: runner.os == 'Windows' && matrix.python == '3.12'
        shell: pwsh
        run: |
          ./scripts/build-package.ps1 -DryRun
          ./scripts/build-package.ps1 -OutDir ./dist
          $dest = Join-Path $env:RUNNER_TEMP "unzipped"
          Expand-Archive -LiteralPath ./dist/JetAI-Hub-portable.zip -DestinationPath $dest
          $root = Join-Path $dest "JetAI-Hub-portable"
          Get-Content (Join-Path $root "PACKAGE.txt")
          $p = Start-Process pwsh -ArgumentList "-NoProfile","-File",(Join-Path $root "jetai.ps1"),"-NoBrowser","-Port","8798" -PassThru -WindowStyle Hidden
          try {
            $body = $null
            for ($i = 0; $i -lt 60 -and -not $body; $i++) {
              try { $body = (Invoke-WebRequest -Uri "http://127.0.0.1:8798/app" -UseBasicParsing -TimeoutSec 2).Content } catch { Start-Sleep -Milliseconds 500 }
            }
            if (-not $body) { throw "the portable package did not serve /app" }
            if ($body -notmatch "JetAI Hub") { throw "/app did not render the app shell" }
            $server = Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -match "workshop.dashboard" } | Select-Object -First 1
            if (-not $server -or $server.ExecutablePath -notlike "*JetAI-Hub-portable*python*python.exe") { throw "the server did not run on the bundled Python: $($server.ExecutablePath)" }
            Write-Host "portable package ran on its bundled Python: $($server.ExecutablePath)"
          } finally {
            Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -match "workshop.dashboard" } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Upload portable package
        if: runner.os == 'Windows' && matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: JetAI-Hub-portable
          path: dist/JetAI-Hub-portable.zip
          retention-days: 7
      - name: Compile modules
        run: python -m compileall -q workshop tests
      - name: Unit and local HTTP integration tests
        id: unittest
        shell: bash
        run: |
          mkdir -p test-results
          python -m unittest discover -s tests -v 2>&1 | tee test-results/unittest.log
          exit ${PIPESTATUS[0]}
      - name: Summarize test results
        if: always()
        shell: bash
        run: |
          {
            echo '## Python tests'
            echo ''
            echo '- Runner: ${{ matrix.os }}'
            echo '- Python: ${{ matrix.python }}'
            echo '- Outcome: ${{ steps.unittest.outcome }}'
            echo ''
            echo 'Download the python-diagnostics artifact for full output.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Python test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-diagnostics-${{ matrix.os }}-py${{ matrix.python }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Runtime preflight
        shell: bash
        run: |
          mkdir -p test-results
          python -m workshop.preflight 2>&1 | tee test-results/preflight.log
          exit ${PIPESTATUS[0]}
      - name: Offline integration diagnostics
        shell: bash
        run: |
          mkdir -p test-results
          python -m workshop.diagnostics --json --no-services > test-results/diagnostics.json
          python -m json.tool test-results/diagnostics.json
      - name: Upload preflight diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preflight-diagnostics-${{ matrix.os }}-py${{ matrix.python }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
  linux-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell syntax
        run: bash -n scripts/bootstrap.sh scripts/start.sh scripts/install-opencode.sh scripts/install-node.sh
      - name: Bootstrap dry run
        run: bash scripts/bootstrap.sh --dry-run
      - name: Node installer dry run
        run: |
          bash scripts/install-node.sh --dry-run
          bash scripts/install-node.sh --dry-run --use-nvm
      - name: OpenCode installer dry run
        run: bash scripts/install-opencode.sh --dry-run
      - name: Validate YAML example
        run: |
          python -m pip install PyYAML
          python -c "import yaml; yaml.safe_load(open('config/workshop.example.yaml', encoding='utf-8'))"
