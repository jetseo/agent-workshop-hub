name: Validate Agent Workshop Hub
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Validate PowerShell scripts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($file in @("install.ps1", "start.ps1")) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | Out-String | Write-Error; exit 1 }
          }
      - name: Compile modules
        run: python -m compileall -q workshop tests
      - name: Unit and local HTTP integration tests
        run: python -m unittest discover -s tests -v
      - name: Runtime preflight
        run: python -m workshop.preflight
  linux-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell syntax
        run: bash -n scripts/bootstrap.sh scripts/start.sh
      - name: Bootstrap dry run
        run: bash scripts/bootstrap.sh --dry-run
      - name: Validate YAML example
        run: |
          python -m pip install PyYAML
          python -c "import yaml; yaml.safe_load(open('config/workshop.example.yaml', encoding='utf-8'))"
