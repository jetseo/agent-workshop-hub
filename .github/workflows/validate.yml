name: Validate bootstrap and Python core
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Bash syntax
        run: bash -n scripts/bootstrap.sh
      - name: Bootstrap dry run
        run: bash scripts/bootstrap.sh --dry-run
      - name: Compile Python
        run: python -m compileall -q workshop tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate example config
        run: |
          python -m pip install PyYAML
          python -c "import yaml; yaml.safe_load(open('config/workshop.example.yaml'))"
